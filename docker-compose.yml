# OPTIONAL development convenience — NOT required to run VaaniReach.
#
# Primary local development is native: a Python venv for the backend and
# `npm` for the frontend, both run directly (see README.md / scripts/setup_dev.sh).
# This compose file exists only for contributors who prefer containers; it is
# not exercised by CI, setup scripts, or any Phase 0 verification step.
#
# NOTE: neither image installs ffmpeg yet. Any future FFmpeg-based renderer
# (see docs/decisions/ADR-005-video-rendering.md) will need it added to the
# backend image once that decision is made.
#
# STATUS: Dockerfiles for ./backend and ./frontend do not exist yet (Phase 0
# ships native tooling only) — `docker compose up` will not work until they
# are added in a later phase. Kept here as a placeholder for that future work.

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - ./data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev
